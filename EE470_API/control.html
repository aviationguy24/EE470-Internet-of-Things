     Description:
     This HTML and JavaScript page provides a simple remote interface
     that allows users to control an LED connected to an ESP8266
     NodeMCU. The LED status is updated on-screen and synchronized
     with the server file results.txt through results.php.

     Functional Overview:
       • "Turn LED ON/OFF" buttons send form-encoded POST requests
         (led=on/off) to results.php.
       • The script fetches current LED state and timestamp using GET.
       • Display updates automatically after every change.

     Integration:
       • Works with results.php (server API) and results.txt
       • Used in conjunction with Part 2C (ESP combined code)
       • Folder: /public_html/EE470API/

   =============================================================== -->

<html lang="en">
    
<head>
  <meta charset="utf-8" />
  <title>EE470 – Remote LED Control</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body{font-family:system-ui,Arial;margin:24px;max-width:700px}
    .row{display:flex;gap:12px;flex-wrap:wrap}
    button{padding:10px 16px;border:0;border-radius:12px;cursor:pointer}
    .on{background:#1f8b4c;color:#fff} .off{background:#a33;color:#fff}
    .card{border:1px solid #ddd;border-radius:14px;padding:16px;margin-top:12px}
    .pill{display:inline-block;padding:4px 10px;border-radius:999px;background:#eee}
  </style>
</head>
<body>
  <h1>Remote LED Control</h1>

  <div class="row">
    <button class="on"  onclick="setLed('on')">Turn LED ON</button>
    <button class="off" onclick="setLed('off')">Turn LED OFF</button>
  </div>

  <div class="card">
    <div>Current status (from <code>results.txt</code>): <span id="state" class="pill">…</span></div>
    <div id="timestamp" style="margin-top:6px;color:#555"></div>
  </div>

  <script>
    // If paths act weird, replace with your full URL:
    // const API = 'https://YOUR-DOMAIN/EE470API/results.php';
    const API = 'results.php';

    async function refresh(){
      const r = await fetch(API, {cache:'no-store'});
      const j = await r.json();
      document.getElementById('state').textContent = j.led || 'unknown';
      document.getElementById('timestamp').textContent = j.ts ? `Last update: ${j.ts}` : '';
    }

    async function setLed(val){
      // Send as form-encoded POST: led=on/off  (most reliable on shared hosting)
      const body = new URLSearchParams({led: val});
      await fetch(API, {
        method: 'POST',
        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
        body
      });
      refresh();
    }

    refresh();
  </script>
</body>
</html>
